name: Eurex Daily Telegram Alert

on:
  schedule:
    - cron: '30 18 * * 1-5'
  workflow_dispatch:

jobs:
  run-reporter:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          pip install requests playwright numpy scipy pandas matplotlib
          playwright install chromium --with-deps

      - name: Execute Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python eurex_reporter.py
