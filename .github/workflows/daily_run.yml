name: Eurex Daily Telegram Alert

on:
  push:
    branches: [ main, master ]
    schedule:
    - cron: '45 15 * * 1-5'  # 16:45 CET (Mercati Aperti: segnali operativi e Bid/Ask reali)
    - cron: '30 18 * * 1-5'  # 19:30 CET (Mercati Chiusi: D. Settle ufficiali e riepilogo serale)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-reporter:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          pip install requests playwright numpy scipy pandas matplotlib pillow yfinance openpyxl
          playwright install chromium --with-deps

      - name: Execute Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python eurex_reporter.py

      - name: Aggiorna Dati per Web-App Android ed Excel nel Repo
        run: |
          git config user.name "Wheel-Bot"
          git config user.email "bot@github.com"
          git add eurex_wheel_chains.csv wheel_data.json Wheel_Control_Center.xlsx || true
          git diff --staged --quiet || git commit -m "Auto-update Eurex Wheel data"
          git push || true
