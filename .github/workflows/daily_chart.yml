name: Invia Grafico BMW Telegram

on:
  schedule:
    # Esegue ogni giorno alle 08:00 UTC (modificabile a piacimento)
    - cron: '0 8 * * *'
  # Permette di testare ed eseguire lo script a mano dalla scheda 'Actions' su GitHub
  workflow_dispatch:

jobs:
  capture-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Clona il repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie e Chromium headless
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Esegui script e invia foto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: "XETR:BMW"
        run: python send_chart.py
